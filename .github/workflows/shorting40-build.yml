name: Shorting 40 Android — tests and installable observe APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'shorting/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/shorting40-build.yml'

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and test short-only app
        run: gradle --no-daemon :shorting:testDebugUnitTest :shorting:assembleDebug
      - name: Assert APK contains separate application
        run: |
          test -s shorting/build/outputs/apk/debug/shorting-debug.apk
          test ! -d shorting/src/main/java/com/multify
          ! grep -R -E 'MULTIFY|CNC BUY' shorting/src/main/java/com/suhas/shorting40
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Shorting-40-v1.2-live-mis-debug-apk
          path: shorting/build/outputs/apk/debug/shorting-debug.apk
          retention-days: 30
